[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solplanet-fasttalk"
version = "0.1.0"
description = "Local-first monitoring and control daemon for Solplanet PV and ESS plants"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "solplanet-fasttalk contributors"}]
dependencies = []

[project.scripts]
solplanet-fasttalk = "solplanet_fasttalk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
