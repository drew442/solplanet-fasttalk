[daemon]
database = "/var/lib/solplanet-fasttalk/history.sqlite3"

[storage]
raw_retention_days = 14
# Long-lived, model-ready 15-minute observations for selected energy, battery,
# limit and operating-state signals. This supports seasonal load/SOC training
# without retaining every high-frequency Modbus sample indefinitely.
quarter_hour_retention_days = 800
hourly_retention_days = 400
daily_retention_days = 3650
prediction_retention_days = 800
plan_retention_days = 800
forecast_retention_days = 800
forecast_context_retention_days = 800
maintenance_interval_seconds = 3600

[api]
# Loopback is the secure default. The diagnostics UI is then available at
# http://127.0.0.1:8765/diagnostics/.
host = "127.0.0.1"
port = 8765
# To opt into LAN access for a phone, bind a LAN interface or 0.0.0.0 and set
# this to a target-only file containing at least 32 random characters. The file
# must be mode 0600. Use a TLS reverse proxy on any untrusted network.
auth_token_file = ""

[eastron]
enabled = true
device = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG04Q3CR-if00-port0"
baud = 9600
grid_slave = 1
external_pv_slave = 2
# Stable convention: grid positive means import; external PV positive means
# delivered generation. Change only after a correlated live validation.
grid_power_multiplier = 1
external_pv_power_multiplier = 1

[asw]
enabled = true
device = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_B003LSFR-if00-port0"
baud = 9600
slave = 3
timeout_seconds = 1.5
# Stable convention used by site.load_power: positive means AC generation from
# the ASW into the site. Set to -1 if live correlation proves the inverse.
active_power_multiplier = 1

[solis]
# Optional diagnostics only. Eastron slave 2 remains authoritative for
# external-PV AC accounting if this plugin is disabled or disagrees.
enabled = true
device = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_B0032EAS-if00-port0"
baud = 9600
slave = 1
timeout_seconds = 1.5
poll_interval_seconds = 5
mismatch_tolerance_watts = 750
mismatch_duration_seconds = 60

[tariff]
# Archived supplied price fact sheet effective 25 May 2026. This deliberately
# does not track or silently adopt later plan changes.
enabled = true
plan = "globird-zerohero-vpp-ausgrid-pre-2026-07"
timezone = "Australia/Sydney"
# Optional target-only JSON containing manually confirmed critical-peak events.
exceptional_events_file = ""

[forecast_solar]
enabled = true
# Credentials and the private plant location remain target-only. Home
# Assistant's core.config file is read at runtime; coordinates are never exposed
# by the daemon API or written to the forecast cache.
api_key_file = "/root/forcast-solar-api.key"
location_file = "/config/.storage/core.config"
cache_file = "/var/lib/solplanet-fasttalk/forecast-solar-cache.json"
refresh_interval_seconds = 1800
retry_interval_seconds = 300
request_timeout_seconds = 15
max_cache_age_seconds = 21600

# Forecast.Solar uses south=0, east=-90 and west=+90. These two entries are the
# 20 x 310 W east and 20 x 310 W west planes already configured in HAOS.
[[forecast_solar.planes]]
name = "east"
declination = 25
azimuth = -90
peak_power_kw = 6.2

[[forecast_solar.planes]]
name = "west"
declination = 25
azimuth = 90
peak_power_kw = 6.2

[weather]
# Open-Meteo's best-match forecast is used as an independent weather context.
# The coordinates are read from this target-only file and are never returned,
# logged, cached, or stored in SQLite. Do not put coordinates in this TOML.
enabled = true
provider = "open-meteo"
location_file = "/config/.storage/core.config"
cache_file = "/var/lib/solplanet-fasttalk/open-meteo-cache.json"
refresh_interval_seconds = 1800
retry_interval_seconds = 300
request_timeout_seconds = 15
max_cache_age_seconds = 10800
forecast_days = 10

[optimisation]
# Phase 6 is recommendation/replay only. There is no call path from this planner
# to a serial write transport.
enabled = true
interval_seconds = 300
horizon_hours = 36
step_minutes = 15
# Three parallel seven-module Ai-HB G2 stacks, 2.56 kWh per module.
battery_capacity_kwh = 53.76
reserve_soc_percent = 15
# With little scored forecast history, shadow export preserves this much SOC.
# It scales continuously down toward reserve_soc_percent as 8–24 hour load/PV
# accuracy and independent-day coverage improve. It never changes native ASW
# settings and is clamped to maximum_soc_percent for simulation.
untrusted_reserve_soc_percent = 85
forecast_confidence_full_days = 84
maximum_soc_percent = 95
max_charge_watts = 12000
max_discharge_watts = 12000
charge_efficiency = 0.95
discharge_efficiency = 0.95
# Conservative configurable boundaries; set these to confirmed site limits.
site_import_limit_watts = 30000
site_export_limit_watts = 30000
minimum_arbitrage_margin_per_kwh = 0.03
# The documented read map does not expose future Custom-mode schedule times.
# Keep false until every recurring native window has been copied into a private
# runtime configuration. Set true with an empty list only after confirming that
# the inverter has no native windows.
native_schedule_confirmed = false

# Example only; put the plant's real recurring local-time windows in its
# untracked private runtime configuration.
# [[optimisation.native_schedule]]
# mode = "charge"
# starts_at = "00:00"
# ends_at = "01:00"
# power_watts = 12000
